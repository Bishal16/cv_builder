services:
  db:
    image: postgres:16-alpine
    container_name: cvbuilder-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cvbuilder
      POSTGRES_USER: cvbuilder
      POSTGRES_PASSWORD: cvbuilder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvbuilder -d cvbuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cvbuilder-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cvbuilder
      SPRING_DATASOURCE_USERNAME: cvbuilder
      SPRING_DATASOURCE_PASSWORD: cvbuilder
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://frontend}
      CVBUILDER_SECURITY_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8081}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cvbuilder-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
