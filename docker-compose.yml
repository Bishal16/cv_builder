services:
  db:
    image: postgres:16-alpine
    container_name: cvbuilder-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cvbuilder
      POSTGRES_USER: cvbuilder
      POSTGRES_PASSWORD: cvbuilder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvbuilder -d cvbuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
