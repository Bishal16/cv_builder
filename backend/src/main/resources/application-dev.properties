# Load .env from project root (same key=value format as .properties)
spring.config.import=optional:file:.env[.properties]

# Local development — PostgreSQL on localhost
spring.datasource.url=jdbc:postgresql://localhost:5433/cvbuilder
spring.datasource.username=${DB_USERNAME:cvbuilder}
spring.datasource.password=${DB_PASSWORD:cvbuilder}

spring.jpa.show-sql=true

# CORS — allow localhost plus any LAN device hitting the Vite dev server on :5173,
# so you can sign in from another machine on the same network. Patterns use '*'.
cvbuilder.security.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://192.168.*:5173,http://10.*:5173,http://172.16.*:5173,http://172.17.*:5173,http://172.18.*:5173
