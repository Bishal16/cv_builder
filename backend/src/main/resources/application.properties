spring.application.name=cvbuilder

# Active profile (override with SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8081

# Security
cvbuilder.security.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me}
cvbuilder.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend base URL for Playwright PDF rendering
cvbuilder.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# OAuth2 Social Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_REDIRECT_BASE_URL:http://localhost:8081}/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${OAUTH_REDIRECT_BASE_URL:http://localhost:8081}/login/oauth2/code/github

# ── AI / LLM provider ──
# Which LLM powers the AI features. Options: gemini (default, free), anthropic, openai
llm.provider=${LLM_PROVIDER:gemini}

# Gemini (Google AI Studio — free tier). Get a key: https://aistudio.google.com/apikey
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# Anthropic (Claude) — used when llm.provider=anthropic
anthropic.api.key=${ANTHROPIC_API_KEY:}
llm.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}

# OpenAI-compatible (Groq / OpenRouter / Ollama) — used when llm.provider=openai
llm.openai.base-url=${LLM_OPENAI_BASE_URL:}
llm.openai.api-key=${LLM_OPENAI_API_KEY:}
llm.openai.model=${LLM_OPENAI_MODEL:}

# AI usage meter — shared daily limit shown in Settings (matches the free-tier cap).
# Window is anchored to first use and resets after window-hours.
llm.usage.limit=${LLM_USAGE_LIMIT:50}
llm.usage.window-hours=${LLM_USAGE_WINDOW_HOURS:24}

# Email (SMTP) — leave blank in dev to log reset links instead of sending
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
