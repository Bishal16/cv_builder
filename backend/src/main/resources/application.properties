spring.application.name=cvbuilder

# Active profile (override with SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8081

# Security
cvbuilder.security.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me}
cvbuilder.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend base URL for Playwright PDF rendering
cvbuilder.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
