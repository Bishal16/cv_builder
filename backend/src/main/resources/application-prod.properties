# Production — all values from environment variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# CORS — set CORS_ALLOWED_ORIGINS to your real frontend origin(s), comma-separated.
cvbuilder.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
