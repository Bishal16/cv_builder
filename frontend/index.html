<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>CV Builder | Professional Resume Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply theme class before React boots to avoid flash of wrong theme.
         Reads the Zustand-persisted value from localStorage synchronously. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-storage');
          var parsed = stored ? JSON.parse(stored) : null;
          var theme = parsed && parsed.state && parsed.state.theme === 'light' ? 'light' : 'dark';
        } catch (_) {
          var theme = 'dark';
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
