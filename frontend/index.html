<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>CV Builder | Professional Resume Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply theme class before React boots to avoid flash of wrong theme.
         Reads the Zustand-persisted value from localStorage synchronously. -->
    <script>
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem('theme-storage');
          var parsed = stored ? JSON.parse(stored) : null;
          var mode = (parsed && parsed.state && parsed.state.mode) || 'system';
          if (mode === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            theme = mode;
          }
        } catch (_) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
